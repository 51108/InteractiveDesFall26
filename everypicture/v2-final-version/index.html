<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonder - Every Picture</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caudex:ital,wght@0,400;0,700;1,400&family=Redressed&display=swap">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <!-- each person: zoom in, card, zoom out -->
    <main>
        <!-- title -->
        <section>
            <header>
                <h1>Sonder</h1>
                <p>Everyone in the crowd has a life as vivid as yours.</p>
                <p>Scroll to look a little closer.</p>
            </header>
        </section>


        <!-- yovi -->

        <!-- zoom in -->
        <section></section>

        <!-- card -->
        <section class="profile">
            <article class="offscreen">
                <h2>Yovi</h2>
                <figure>
                    <img src="images/yovi-like.jpg" alt="Yovi in a blue jacket, drawing on a fogged-up mirror" width="540" height="720">
                    <figcaption>
                        <h3>likes</h3>
                        drawing on fogged-up glass
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/yovi-dislike.jpg" alt="Yovi holding up a tangled charger cable against a green wall" width="540" height="720">
                    <figcaption>
                        <h3>dislikes</h3>
                        chargers that only work at a certain angle
                    </figcaption>
                </figure>
            </article>
        </section>

        <!-- zoom out -->
        <section></section>


        <!-- zosia -->

        <!-- zoom in -->
        <section></section>

        <!-- card -->
        <section class="profile">
            <article class="offscreen">
                <h2>Zosia</h2>
                <figure>
                    <img src="images/zosia-like.jpg" alt="a double exposure of Zosia painting at an easel, layered over a street sign and a castle" width="540" height="720">
                    <figcaption>
                        <h3>likes</h3>
                        being mistaken for a local when traveling
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/zosia-dislike.jpg" alt="Zosia standing on a kitchen counter, leaning into the light" width="540" height="720">
                    <figcaption>
                        <h3>dislikes</h3>
                        the gap between the fridge and the counter where things fall forever
                    </figcaption>
                </figure>
            </article>
        </section>

        <!-- zoom out -->
        <section></section>


        <!-- audrey -->

        <!-- zoom in -->
        <section></section>

        <!-- card -->
        <section class="profile">
            <article class="offscreen">
                <h2>Audrey</h2>
                <figure>
                    <img src="images/audrey-like.jpg" alt="Audrey lounging in a red chair in a sunny garden" width="540" height="720">
                    <figcaption>
                        <h3>likes</h3>
                        peeling tangerines in one piece
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/audrey-dislike.jpg" alt="Audrey sitting on a washing machine with her fingers in her ears" width="540" height="720">
                    <figcaption>
                        <h3>dislikes</h3>
                        the sound her laundry machine makes three-quarters of the way through
                    </figcaption>
                </figure>
            </article>
        </section>

        <!-- zoom out -->
        <section></section>


        <!-- eleanor -->

        <!-- zoom in -->
        <section></section>

        <!-- card -->
        <section class="profile">
            <article class="offscreen">
                <h2>Eleanor</h2>
                <figure>
                    <img src="images/eleanor-like.jpg" alt="Eleanor at a DJ setup, layered with green and pink lights" width="540" height="720">
                    <figcaption>
                        <h3>likes</h3>
                        when two songs she likes have the same BPM, so they're easy to mix
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/eleanor-dislike.jpg" alt="Eleanor reflected in the round glass of a fish tank" width="540" height="720">
                    <figcaption>
                        <h3>dislikes</h3>
                        people who tap on fish tanks
                    </figcaption>
                </figure>
            </article>
        </section>


        <!-- ending -->
        <section>
            <p>Somewhere in someone else's crowd,</p>
            <p>you're the blur walking past.</p>
            <footer>
                <a href="#">look again</a>
                <a href="../../index.html">back to portfolio</a>
            </footer>
        </section>
    </main>

    <!-- crowd photo: grey copy + color copy on top -->
    <figure id="crowd-photo" class="crowd">
        <img src="images/crowd.jpg" alt="a double exposure of a busy old-town street at golden hour, full of people walking" width="1920" height="1242">
        <img src="images/crowd.jpg" alt="" width="1920" height="1242" class="spotlight">
    </figure>
</body>

</html>
